name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: ValueObject.java is generated from the current value objects
        run: java codegen/GenerateValueObject.java --check
      - name: tzdata.json is what the pinned IANA release gives
        run: java data/Tzdata.java --check
      - name: countries.json is what the Wikidata snapshot gives
        run: java data/Countries.java --check
      - run: mvn -B verify
