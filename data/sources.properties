# Where each data file in src/main/resources/io/joshuasalcedo/valueobject/data comes from.
# Every source is pinned, so a run gives the same output on any machine; see data/README.md to move a pin.

# IANA time zone database. `java data/Tzdata.java --latest` moves this to the newest release.
tzdata.version=2026f
tzdata.sha256=01b4a91cec5167ed48c11e8ab78f2048cead78ce94b0cafcad0ae8c5a3044d3d
tzdata.url=https://data.iana.org/time-zones/releases/tzdata{version}.tar.gz

# Wikidata (CC0). The query result is kept in data/raw/wikidata-countries.csv;
# `java data/Countries.java --refresh` asks Wikidata again.
wikidata.sparql=https://query.wikidata.org/sparql

# When two Wikidata items carry the same ISO 3166-1 alpha-2 code, the one that is the country.
wikidata.item.AQ=Q51
wikidata.item.CY=Q229
